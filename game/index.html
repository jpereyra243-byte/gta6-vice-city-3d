<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VICE UNDERWORLD: 3D OPEN WORLD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #instructions-overlay {
      position: absolute;
      bottom: 24px;
      right: 28px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #ff007f;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      pointer-events: none;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="instructions-overlay">
    <b>CONTROLS:</b><br>
    [WASD] Walk / Drive<br>
    [SHIFT] Sprint<br>
    [MOUSE] Look / Aim<br>
    [CLICK] Shoot Pistol<br>
    [F] Enter / Exit Vehicle<br>
    [SPACE] Handbrake Drift<br>
    [R] Radio Station<br>
    [H] Horn
  </div>

  <script type="module">
    import { Game } from './src/main.js';
    window.addEventListener('DOMContentLoaded', () => {
      const game = new Game();
      game.init();
      window.__GAME__ = game;
    });
  </script>
</body>
</html>
